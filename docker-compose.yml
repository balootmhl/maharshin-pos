services:
  app:
    build:
      dockerfile_inline: |
        FROM serversideup/php:8.3-fpm-nginx
        USER root
        RUN apt-get update && apt-get install -y \
                libpng-dev libjpeg-dev libfreetype6-dev libexif-dev \
            && docker-php-ext-configure gd --with-freetype --with-jpeg \
            && docker-php-ext-install gd exif \
            && apt-get clean && rm -rf /var/lib/apt/lists/*
        USER www-data
    ports:
      - "${DOCKER_APP_PORT:-8000}:8080"
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pos_internal

  node:
    image: node:22-alpine
    user: "1000:1000"
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "${DOCKER_VITE_PORT:-5174}:5174"
    environment:
      - DOCKER_VITE_PORT=${DOCKER_VITE_PORT:-5174}
    command: sh -c "npx pnpm install && npx pnpm dev --port 5174"
    networks:
      - pos_internal

networks:
  pos_internal:
    driver: bridge

